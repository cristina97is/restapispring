server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotels
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**
            - id: booking
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/bookings,/booking/**,/booking,/bookings,/api/auth/**,/user/**,/user,/api/users/**,/api/users
  main:
    web-application-type: reactive
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
app:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'
