server:
  port: 8081
spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotels;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
app:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'
